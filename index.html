<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Meeting Room Booking</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f6f5f1;--surface:#fff;--ink:#1d2229;--muted:#6b7380;--line:#e4e2db;--accent:#1f4e79;--accent-ink:#fff;--closed:#eceae4;--danger:#c0392b;--ok:#12805c}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15181c;--surface:#1e2227;--ink:#e8eaed;--muted:#9aa2ad;--line:#2f353d;--accent:#6aa8e6;--accent-ink:#0d1620;--closed:#191c20;--danger:#ef7b6e;--ok:#4cc79c}}
:root[data-theme="dark"]{--bg:#15181c;--surface:#1e2227;--ink:#e8eaed;--muted:#9aa2ad;--line:#2f353d;--accent:#6aa8e6;--accent-ink:#0d1620;--closed:#191c20;--danger:#ef7b6e;--ok:#4cc79c}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:1180px;margin:0 auto;padding:16px}
header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:12px}
h1{font-size:20px;margin:0;font-weight:650;letter-spacing:-.01em}
h1 small{display:block;font-weight:400;color:var(--muted);font-size:12.5px;letter-spacing:0}
button,select,input{font:inherit;color:inherit}
button{border:1px solid var(--line);background:var(--surface);padding:7px 12px;border-radius:8px;cursor:pointer}
button:hover{border-color:var(--muted)}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
button.danger{color:var(--danger);border-color:var(--danger)}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.bar .grow{flex:1}
.seg{display:inline-flex}.seg button{border-radius:0}.seg button:first-child{border-radius:8px 0 0 8px}.seg button:last-child{border-radius:0 8px 8px 0}.seg button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.title{font-weight:600;min-width:170px;text-align:center}
.legend{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:99px;border:1px solid var(--line);background:var(--surface);font-size:13px;cursor:pointer}
.chip i{width:10px;height:10px;border-radius:50%;display:inline-block}
.chip.off{opacity:.4}
.banner{padding:8px 12px;border-radius:8px;font-size:13px;margin-bottom:10px;background:var(--surface);border:1px solid var(--line);color:var(--muted)}
.banner.admin{border-color:var(--ok);color:var(--ok)}
.cal{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow-x:auto}
.week{display:grid;grid-template-columns:52px repeat(7,minmax(110px,1fr));min-width:820px}
.wh{padding:8px 6px;text-align:center;border-bottom:1px solid var(--line);border-left:1px solid var(--line);font-size:13px;position:sticky;top:0;background:var(--surface);z-index:2}
.wh b{display:block;font-size:17px}.wh.today b{color:var(--accent)}
.gut{position:relative}.gut div{height:48px;font-size:11px;color:var(--muted);text-align:right;padding:0 6px;transform:translateY(-7px)}
.col{position:relative;border-left:1px solid var(--line);cursor:cell;background-image:linear-gradient(var(--line) 1px,transparent 1px);background-size:100% 48px}
.col.past{background-color:var(--closed);cursor:not-allowed}
.col.closed{background:repeating-linear-gradient(135deg,var(--closed) 0 8px,transparent 8px 16px);cursor:not-allowed}
.col.closed::after{content:"Closed";position:absolute;top:8px;left:0;right:0;text-align:center;color:var(--muted);font-size:12px}
.ev{position:absolute;border-radius:6px;padding:3px 6px;font-size:12px;line-height:1.25;color:#fff;overflow:hidden;cursor:pointer;border:1px solid rgba(0,0,0,.15)}
.ev b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.month{display:grid;grid-template-columns:repeat(7,minmax(90px,1fr));min-width:700px}
.mh{padding:8px;font-size:12px;color:var(--muted);text-align:center;border-bottom:1px solid var(--line)}
.md{min-height:104px;border-top:1px solid var(--line);border-left:1px solid var(--line);padding:4px;cursor:pointer;font-size:12px}
.md.closed{background:var(--closed);cursor:default}.md.other{opacity:.45}
.md .n{font-weight:600;margin-bottom:2px}.md.today .n{color:var(--accent)}
.pill{display:block;color:#fff;border-radius:4px;padding:1px 5px;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.more{color:var(--muted)}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);padding:0;width:min(440px,calc(100vw - 24px))}
dialog::backdrop{background:rgba(0,0,0,.45)}
.mb{padding:18px}.mb h2{margin:0 0 12px;font-size:17px}
label{display:block;font-size:12.5px;color:var(--muted);margin:10px 0 3px}
input,select{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.row{display:flex;gap:10px}.row>div{flex:1}
.err{color:var(--danger);font-size:13px;margin-top:10px;min-height:18px}
.acts{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
.ov{display:flex;gap:8px;align-items:center;margin-top:10px;font-size:13px;color:var(--danger)}.ov input{width:auto}
.dl{display:grid;grid-template-columns:90px 1fr;gap:6px 10px;font-size:14px}.dl dt{color:var(--muted)}.dl dd{margin:0}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Meeting Room Booking<small>Marina · Kovalam · Eliots · Auroville · Meeting Room 5 &nbsp;|&nbsp; Mon–Sat, closed on Sundays</small></h1>
    <div style="display:flex;gap:8px"><button id="adminBtn">Admin login</button><button class="primary" id="newBtn">+ Book a room</button></div>
  </header>
  <div id="banner" class="banner" hidden></div>
  <div class="bar">
    <button id="prev" aria-label="Previous">‹</button><button id="today">Today</button><button id="next" aria-label="Next">›</button>
    <span class="title" id="ttl"></span><span class="grow"></span>
    <div class="seg"><button id="vWeek" class="on">Week</button><button id="vMonth">Month</button></div>
  </div>
  <div class="legend" id="legend"></div>
  <div class="cal" id="cal"></div>
</div>

<dialog id="dlg"><div class="mb" id="dlgBody"></div></dialog>

<script>
// ---- Config (the owner can change these) ----
const ADMIN_PIN = "1234";                 // change this before sharing
const ROOMS = [["Marina","#2a7de1"],["Kovalam","#12805c"],["Eliots","#c46f0a"],["Auroville","#7a4fc4"],["Meeting Room 5","#c43a63"]];
const DAY_START = 8*60, DAY_END = 20*60, STEP = 30, HOUR_PX = 48;

// ---- State ----
let bookings = [], isAdmin = false, view = "week", cursor = new Date(), shown = new Set(ROOMS.map(r=>r[0]));
let col = null, localMode = false;
const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2,"0");
const ds = d => d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const parse = s => { const [y,m,d]=s.split("-").map(Number); return new Date(y,m-1,d); };
const fmt = m => { const h=Math.floor(m/60), mm=m%60, ap=h>=12?"pm":"am"; return ((h+11)%12+1)+(mm?":"+pad(mm):"")+ap; };
const color = r => (ROOMS.find(x=>x[0]===r)||[0,"#555"])[1];
const esc = s => String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const isSun = d => d.getDay()===0;
const mondayOf = d => { const x=new Date(d); x.setDate(x.getDate()-((x.getDay()+6)%7)); x.setHours(0,0,0,0); return x; };
const nowMin = () => { const n=new Date(); return n.getHours()*60+n.getMinutes(); };
const isPast = (date,start) => { const t=ds(new Date()); return date<t || (date===t && start<nowMin()); };
const conflict = (b, ignoreId) => bookings.find(o => o.id!==ignoreId && o.room===b.room && o.date===b.date && b.start<o.end && o.start<b.end);

// ---- Storage: shared db when available, otherwise this browser only ----
function saveLocal(){ try{localStorage.setItem("rb_bookings",JSON.stringify(bookings))}catch(e){} }
async function putBooking(b){
  if(col){ const {id,...rest}=b; await col.doc(id).set(rest); }
  else { bookings = bookings.filter(x=>x.id!==b.id).concat(b); saveLocal(); render(); }
}
async function delBooking(id){
  if(col){ await col.doc(id).delete(); }
  else { bookings = bookings.filter(x=>x.id!==id); saveLocal(); render(); }
}
function useLocal(){
  localMode = true;
  try{ bookings = JSON.parse(localStorage.getItem("rb_bookings")||"[]"); }catch(e){ bookings=[]; }
  banner(); render();
}
(async function init(){
  render();
  const t = setTimeout(()=>{ if(!col) useLocal(); }, 10000);
  try{
    const db = await window.claude.use("db");
    if(!db){ clearTimeout(t); useLocal(); return; }
    col = db.collection("bookings");
    let first = true;
    col.onSnapshot(s=>{ clearTimeout(t); bookings = s.docs.map(d=>({id:d.id,...d.data()})); localMode=false;
        // One-time carry-over: bookings saved earlier in this browser move into permanent storage
        if(first){ first=false;
          try{ const have=new Set(s.docs.map(d=>d.id)); const old=JSON.parse(localStorage.getItem("rb_bookings")||"[]");
            const jobs=old.filter(o=>o&&o.id&&!have.has(o.id)).map(({id,...rest})=>col.doc(id).set(rest));
            Promise.all(jobs).then(()=>{ try{localStorage.removeItem("rb_bookings");}catch(e){} }).catch(()=>{});
          }catch(e){} }
        render(); },
                   ()=>{ clearTimeout(t); col=null; useLocal(); });
  }catch(e){ clearTimeout(t); useLocal(); }
})();

function banner(){
  const b=$("banner"); b.hidden=false; b.className="banner"+(isAdmin?" admin":"");
  if(isAdmin) b.textContent="Admin mode: you can edit, delete and override any booking.";
  else if(localMode) b.textContent="Shared storage isn’t available here, so bookings are saved only in this browser.";
  else b.hidden=true;
}

// ---- Rendering ----
function render(){
  $("adminBtn").textContent = isAdmin ? "Admin logout" : "Admin login";
  banner();
  $("vWeek").classList.toggle("on",view==="week"); $("vMonth").classList.toggle("on",view==="month");
  $("legend").innerHTML = ROOMS.map(([n,c])=>`<span class="chip ${shown.has(n)?"":"off"}" data-r="${esc(n)}"><i style="background:${c}"></i>${esc(n)}</span>`).join("");
  $("legend").querySelectorAll(".chip").forEach(el=>el.onclick=()=>{ const r=el.dataset.r; shown.has(r)?shown.delete(r):shown.add(r); render(); });
  view==="week" ? renderWeek() : renderMonth();
}
const visible = date => bookings.filter(b=>b.date===date && shown.has(b.room)).sort((a,b)=>a.start-b.start||a.end-b.end);

function renderWeek(){
  const mon = mondayOf(cursor), days = [...Array(7)].map((_,i)=>{const d=new Date(mon);d.setDate(d.getDate()+i);return d;});
  $("ttl").textContent = days[0].toLocaleDateString("en-IN",{day:"numeric",month:"short"})+" – "+days[6].toLocaleDateString("en-IN",{day:"numeric",month:"short",year:"numeric"});
  const todayS = ds(new Date()), hrs = (DAY_END-DAY_START)/60;
  let h = `<div class="week"><div class="wh"></div>`;
  days.forEach(d=>h+=`<div class="wh ${ds(d)===todayS?"today":""}">${d.toLocaleDateString("en-IN",{weekday:"short"})}<b>${d.getDate()}</b></div>`);
  h += `<div class="gut">`; for(let i=0;i<hrs;i++) h+=`<div>${fmt(DAY_START+i*60)}</div>`; h+=`</div>`;
  days.forEach(d=>{
    const s=ds(d), closed=isSun(d);
    h+=`<div class="col ${closed?"closed":""} ${s<todayS?"past":""}" data-d="${s}" style="height:${hrs*HOUR_PX}px">`;
    // lane layout for overlapping events (visible only when several rooms are shown)
    const evs = visible(s), lanes=[]; let cluster=[], clusterEnd=0;
    const flush=()=>{ const n=Math.max(1,...cluster.map(e=>e.lane+1)); cluster.forEach(e=>e.n=n); cluster=[]; };
    evs.forEach(e=>{ if(cluster.length && e.start>=clusterEnd){flush();} 
      const used=cluster.filter(c=>c.end>e.start).map(c=>c.lane); let l=0; while(used.includes(l)) l++;
      e.lane=l; cluster.push(e); clusterEnd=Math.max(clusterEnd,e.end); }); flush();
    evs.forEach(e=>{
      const top=(e.start-DAY_START)/60*HOUR_PX, ht=Math.max(22,(e.end-e.start)/60*HOUR_PX-2), w=100/e.n;
      h+=`<div class="ev" data-id="${e.id}" style="top:${top}px;height:${ht}px;left:calc(${e.lane*w}% + 2px);width:calc(${w}% - 4px);background:${color(e.room)}"><b>${esc(e.room)}</b>${esc(e.title)} · ${fmt(e.start)}–${fmt(e.end)}</div>`;
    });
    h+=`</div>`;
  });
  $("cal").innerHTML = h+`</div>`;
  $("cal").querySelectorAll(".col:not(.closed)").forEach(c=>c.onclick=ev=>{
    if(ev.target.closest(".ev")) return;
    const y=ev.clientY-c.getBoundingClientRect().top; let m=DAY_START+Math.floor(y/HOUR_PX*60/STEP)*STEP;
    const day=c.dataset.d;
    if(day<ds(new Date())) return;
    if(isPast(day,m)){ m=Math.ceil(nowMin()/STEP)*STEP; if(m>DAY_END-STEP) return; }
    openForm({date:day,start:m,end:Math.min(m+60,DAY_END)});
  });
  bindEvents();
}

function renderMonth(){
  const first=new Date(cursor.getFullYear(),cursor.getMonth(),1), start=mondayOf(first), todayS=ds(new Date());
  $("ttl").textContent = first.toLocaleDateString("en-IN",{month:"long",year:"numeric"});
  let h=`<div class="month">`+["Mon","Tue","Wed","Thu","Fri","Sat","Sun"].map(d=>`<div class="mh">${d}</div>`).join("");
  for(let i=0;i<42;i++){
    const d=new Date(start); d.setDate(d.getDate()+i); const s=ds(d), evs=visible(s);
    if(i>=35 && d.getMonth()!==first.getMonth()) break;
    h+=`<div class="md ${isSun(d)?"closed":""} ${d.getMonth()!==first.getMonth()?"other":""} ${s===todayS?"today":""}" data-d="${s}"><div class="n">${d.getDate()}${isSun(d)?" · closed":""}</div>`;
    evs.slice(0,3).forEach(e=>h+=`<span class="pill" data-id="${e.id}" style="background:${color(e.room)}">${fmt(e.start)} ${esc(e.room)}</span>`);
    if(evs.length>3) h+=`<span class="more">+${evs.length-3} more</span>`;
    h+=`</div>`;
  }
  $("cal").innerHTML=h+`</div>`;
  $("cal").querySelectorAll(".md:not(.closed)").forEach(c=>c.onclick=ev=>{
    if(ev.target.closest("[data-id]")) return;
    cursor=parse(c.dataset.d); view="week"; render();
  });
  bindEvents();
}
function bindEvents(){ $("cal").querySelectorAll("[data-id]").forEach(el=>el.onclick=e=>{e.stopPropagation();openDetails(el.dataset.id);}); }

// ---- Dialogs ----
function timeOpts(sel,from,to){ let o=""; for(let m=from;m<=to;m+=STEP) o+=`<option value="${m}" ${m===sel?"selected":""}>${fmt(m)}</option>`; return o; }
function openForm(b){
  const edit = !!b.id; const dlg=$("dlg");
  const rooms = ROOMS.map(([n])=>`<option ${n===(b.room||[...shown][0])?"selected":""}>${esc(n)}</option>`).join("");
  $("dlgBody").innerHTML = `<h2>${edit?"Edit booking":"Book a room"}</h2>
    <label>Your name</label><input id="fBy" maxlength="40" value="${esc(b.by||"")}" placeholder="e.g. Priya">
    <label>Meeting title</label><input id="fTitle" maxlength="60" value="${esc(b.title||"")}" placeholder="e.g. Sprint planning">
    <label>Room</label><select id="fRoom">${rooms}</select>
    <label>Date</label><input type="date" id="fDate" ${edit?"":`min="${ds(new Date())}"`} value="${b.date||ds(new Date())}">
    <div class="row"><div><label>From</label><select id="fS"></select></div>
    <div><label>To</label><select id="fE">${timeOpts(b.end||DAY_START+60,DAY_START+STEP,DAY_END)}</select></div></div>
    <div id="ovBox"></div><div class="err" id="err"></div>
    <div class="acts"><button id="cx">Cancel</button><button class="primary" id="ok">${edit?"Save changes":"Confirm booking"}</button></div>`;
  $("cx").onclick=()=>dlg.close();
  const okPast=(d,m)=>!(d&&isPast(d,m)) || (edit&&d===b.date&&m===b.start);
  const fixEnd=()=>{ const s=+$("fS").value; if(+$("fE").value<=s) $("fE").value=String(Math.min(s+60,DAY_END)); };
  const fillFrom=want=>{ const d=$("fDate").value; let h="", first=null;
    for(let m=DAY_START;m<=DAY_END-STEP;m+=STEP){ const ok=okPast(d,m); if(ok&&first===null) first=m; h+=`<option value="${m}" ${ok?"":"disabled"}>${fmt(m)}</option>`; }
    $("fS").innerHTML=h; $("fS").value=String(want!=null&&okPast(d,want)?want:(first!=null?first:DAY_START)); fixEnd(); };
  fillFrom(b.start!=null?b.start:null);
  if(b.end) $("fE").value=String(b.end); fixEnd();
  $("fDate").onchange=()=>fillFrom(+$("fS").value);
  $("fS").onchange=fixEnd;
  $("ok").onclick=async()=>{
    const by=$("fBy").value.trim(), title=$("fTitle").value.trim(), date=$("fDate").value, s=+$("fS").value, e=+$("fE").value, room=$("fRoom").value;
    const err=m=>{$("err").textContent=m;};
    if(!by) return err("Please enter your name.");
    if(!title) return err("Please enter a meeting title.");
    if(!date) return err("Please choose a date.");
    if(isSun(parse(date))) return err("Bookings aren’t allowed on Sundays.");
    if(e<=s) return err("End time must be after the start time.");
    if(!(edit&&date===b.date&&s===b.start) && isPast(date,s)) return err("You can’t book a date or time that has already passed. Please choose a current or future slot.");
    const nb={id:b.id||("b"+Date.now().toString(36)+Math.random().toString(36).slice(2,6)),room,date,start:s,end:e,title,by};
    const c=conflict(nb,b.id);
    if(c){
      if(!isAdmin) return err(`${room} is already booked ${fmt(c.start)}–${fmt(c.end)} (${c.title}, ${c.by}). Please pick another time or room.`);
      if(!document.getElementById("ovChk")){
        $("ovBox").innerHTML=`<label class="ov"><input type="checkbox" id="ovChk"> Admin override: allow this overlap with “${esc(c.title)}” (${fmt(c.start)}–${fmt(c.end)})</label>`;
        return err("This slot overlaps an existing booking.");
      }
      if(!$("ovChk").checked) return err("Tick the override box to book over the existing meeting.");
    }
    $("ok").disabled=true;
    try{ await putBooking(nb); dlg.close(); }catch(x){ $("ok").disabled=false; err("Couldn’t save. You may not have permission to write to this page’s shared data."); }
  };
  if(!dlg.open) dlg.showModal();
}
function openDetails(id){
  const b=bookings.find(x=>x.id===id); if(!b) return; const dlg=$("dlg");
  $("dlgBody").innerHTML=`<h2><span class="chip" style="cursor:default"><i style="background:${color(b.room)}"></i>${esc(b.room)}</span></h2>
    <dl class="dl"><dt>Meeting</dt><dd>${esc(b.title)}</dd><dt>Booked by</dt><dd>${esc(b.by)}</dd>
    <dt>Date</dt><dd>${parse(b.date).toLocaleDateString("en-IN",{weekday:"long",day:"numeric",month:"long",year:"numeric"})}</dd>
    <dt>Time</dt><dd>${fmt(b.start)} – ${fmt(b.end)}</dd></dl>
    ${isAdmin?"":`<p style="color:var(--muted);font-size:13px;margin:12px 0 0">Only an admin can edit or delete bookings.</p>`}
    <div class="acts"><button id="cx">Close</button>${isAdmin?`<button id="ed">Edit</button><button class="danger" id="dl">Delete</button>`:""}</div>`;
  $("cx").onclick=()=>dlg.close();
  if(isAdmin){
    $("ed").onclick=()=>openForm(b);
    $("dl").onclick=async()=>{ if(confirm("Delete this booking?")){ try{await delBooking(b.id);}catch(e){alert("Couldn’t delete.");} dlg.close(); } };
  }
  if(!dlg.open) dlg.showModal();
}

// ---- Controls ----
$("newBtn").onclick=()=>{ let d=new Date(); if(nowMin()>DAY_END-STEP) d.setDate(d.getDate()+1); if(isSun(d)) d.setDate(d.getDate()+1); openForm({date:ds(d)}); };
$("adminBtn").onclick=()=>{
  if(isAdmin){ isAdmin=false; render(); return; }
  const p=prompt("Enter admin PIN"); if(p===null) return;
  if(p===ADMIN_PIN){ isAdmin=true; render(); } else alert("Incorrect PIN.");
};
const shift=n=>{ if(view==="week") cursor.setDate(cursor.getDate()+7*n); else cursor=new Date(cursor.getFullYear(),cursor.getMonth()+n,1); render(); };
$("prev").onclick=()=>shift(-1); $("next").onclick=()=>shift(1); $("today").onclick=()=>{cursor=new Date();render();};
$("vWeek").onclick=()=>{view="week";render();}; $("vMonth").onclick=()=>{view="month";render();};
</script>
</body>
</html>
