<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DLF Meeting Room Scheduler</title>
<style>
:root{--bg:#f6f5f1;--card:#fff;--tx:#1c1c1a;--mu:#6b6a64;--bd:#dcdad2;--ac:#1d4e89;--act:#fff;--bad:#b3261e;--tod:#e8f0fa;color-scheme:light light dark}
@media (prefers-color-scheme:dark){:root{--bg:#171716;--card:#222220;--tx:#eeede8;--mu:#a09f97;--bd:#3a3935;--ac:#7fb0ea;--act:#10233b;--bad:#f2928b;--tod:#1f2c3d}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:980px;margin:0 auto;padding:16px}
header{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px}
h1{font-size:20px;margin:0}h2{font-size:16px;margin:0 0 8px}.mu{color:var(--mu);font-size:13px}
nav{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
button,input,select{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:6px;padding:7px 10px}
button{cursor:pointer}button.p{background:var(--ac);color:var(--act);border-color:var(--ac)}button.on{border-color:var(--ac);color:var(--ac);font-weight:600}button.d{color:var(--bad);border-color:var(--bad)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:14px;margin-bottom:12px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:end}
label{display:flex;flex-direction:column;font-size:12px;color:var(--mu);gap:3px}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}.dh{font-size:12px;color:var(--mu);text-align:center}
.day{min-height:64px;border:1px solid var(--bd);border-radius:6px;padding:4px;text-align:left;background:var(--card);overflow:hidden;font-size:12px}
.day.t{background:var(--tod)}.day.s{border-color:var(--ac);outline:1px solid var(--ac)}.day.x{opacity:.45}.day.e{visibility:hidden}
.cnt{color:var(--ac);display:block;margin-top:2px}.bk{border-top:1px solid var(--bd);padding:8px 0}.bk:first-child{border-top:0}
.msg{padding:8px 10px;border-radius:6px;margin-bottom:10px;border:1px solid var(--bd)}.msg.err{color:var(--bad);border-color:var(--bad)}
@media(max-width:600px){.day{min-height:52px;font-size:11px}}
</style>
</head>
<body>
<main>
<header><div><h1>DLF Meeting Room Scheduler</h1><div class="mu" id="who"></div></div><button id="out" hidden>Sign out</button></header>
<nav id="nav" hidden><button id="tCal">Calendar</button><button id="tBook">Book a room</button><button id="tAdm">Profile</button></nav>
<div id="msg"></div>
<section id="v"></section>
</main>
<script>
(function(){
var MN=["January","February","March","April","May","June","July","August","September","October","November","December"];
var S={me:null,rooms:[],bk:[],month:new Date(),sel:null,edit:null,tab:"cal",now:null,admins:null};
S.month.setDate(1);
var $=function(i){return document.getElementById(i)};
function el(t,a,k){var e=document.createElement(t);if(a)for(var x in a){if(x==="text")e.textContent=a[x];else if(x==="class")e.className=a[x];else e.setAttribute(x,a[x])}(k||[]).forEach(function(c){e.appendChild(c)});return e}
function pad(n){return n<10?"0"+n:""+n}
function mkey(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)}
function today(){return S.now.d}
function fmt(s){var p=s.split("-");return p[2]+" "+MN[+p[1]-1].slice(0,3)+" "+p[0]}
function say(t,err){var m=$("msg");m.textContent="";if(t){m.appendChild(el("div",{class:"msg"+(err?" err":""),text:t}));setTimeout(function(){m.textContent=""},5000)}}
async function api(m,u,b){var r=await fetch(u,{method:m,headers:{"Content-Type":"application/json"},body:b?JSON.stringify(b):undefined});var j=await r.json().catch(function(){return{}});if(!r.ok){var e=new Error(j.error||"Something went wrong");e.status=r.status;throw e}return j}
async function boot(){
  var j=await api("GET","/api/me");S.me=j.user;S.rooms=j.rooms;S.now=j.now;if(!S.sel)S.sel=j.now.d;
  $("who").textContent=S.me?S.me.name+" · "+S.me.email+" · "+(S.me.admin?"Admin":"Member"):"DLF";
  $("out").hidden=$("nav").hidden=!S.me;
  if(!S.me)return rAuth();
  await load();render();
}
async function load(){try{S.bk=await api("GET","/api/bookings?month="+mkey(S.month))}catch(e){if(e.status===401)return boot();say(e.message,true)}}
function byDay(d){return S.bk.filter(function(b){return b.date===d})}
function tab(t){S.tab=t;render()}
async function render(){
  ["tCal","tBook","tAdm"].forEach(function(i){$(i).className=({tCal:"cal",tBook:"book",tAdm:"adm"})[i]===S.tab?"on":""});
  $("tAdm").textContent=S.me.admin?"Admin profile":"My profile";
  if(S.tab==="cal")rCal();else if(S.tab==="book")rBook();else rAdm();
}
function rAuth(){
  var v=$("v");v.textContent="";var reg=false;
  var card=el("div",{class:"card",style:"max-width:380px"});
  var name=el("input",{type:"text",placeholder:"Full name"}),em=el("input",{type:"email",placeholder:"Work email"}),pw=el("input",{type:"password",placeholder:"Password (8+ characters)"});
  var go=el("button",{class:"p",text:"Sign in"}),sw=el("button",{text:"New here? Create account"}),h=el("h2",{text:"Sign in"});
  function paint(){h.textContent=reg?"Create account":"Sign in";go.textContent=reg?"Create account":"Sign in";sw.textContent=reg?"Have an account? Sign in":"New here? Create account";name.style.display=reg?"":"none"}
  sw.onclick=function(){reg=!reg;paint()};
  go.onclick=async function(){try{await api("POST",reg?"/api/register":"/api/login",{name:name.value,email:em.value,password:pw.value});S.sel=null;boot()}catch(e){say(e.message,true)}};
  pw.onkeydown=function(e){if(e.key==="Enter")go.onclick()};
  var f=el("div",{class:"row",style:"flex-direction:column;align-items:stretch"},[name,em,pw,go,sw]);
  card.appendChild(h);card.appendChild(f);v.appendChild(card);paint();
}
function rCal(){
  var v=$("v");v.textContent="";
  var y=S.month.getFullYear(),m=S.month.getMonth(),first=new Date(y,m,1).getDay(),n=new Date(y,m+1,0).getDate();
  var head=el("div",{class:"row",style:"justify-content:space-between;align-items:center;margin-bottom:8px"},[el("button",{text:"← Prev"}),el("h2",{text:MN[m]+" "+y,style:"margin:0"}),el("button",{text:"Next →"})]);
  head.children[0].onclick=async function(){S.month=new Date(y,m-1,1);await load();rCal()};
  head.children[2].onclick=async function(){S.month=new Date(y,m+1,1);await load();rCal()};
  var card=el("div",{class:"card"});card.appendChild(head);
  var g=el("div",{class:"grid"});
  ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"].forEach(function(d){g.appendChild(el("div",{class:"dh",text:d}))});
  for(var i=0;i<first;i++)g.appendChild(el("div",{class:"day e"}));
  for(var d=1;d<=n;d++){(function(d){
    var k=y+"-"+pad(m+1)+"-"+pad(d),c=byDay(k).length;
    var b=el("button",{class:"day"+(k===today()?" t":"")+(k===S.sel?" s":"")+(k<today()?" x":"")},[el("b",{text:""+d})]);
    if(c)b.appendChild(el("span",{class:"cnt",text:c+" meeting"+(c>1?"s":"")}));
    b.onclick=function(){S.sel=k;rCal()};g.appendChild(b)})(d)}
  card.appendChild(g);v.appendChild(card);
  var day=S.sel,list=byDay(day),c2=el("div",{class:"card"});
  var h=el("div",{class:"row",style:"justify-content:space-between;align-items:center;margin-bottom:6px"},[el("h2",{text:"Meetings on "+fmt(day),style:"margin:0"})]);
  if(day>=today()){var nb=el("button",{class:"p",text:"Book on this day"});nb.onclick=function(){S.edit={date:day};tab("book")};h.appendChild(nb)}
  c2.appendChild(h);
  if(!list.length)c2.appendChild(el("div",{class:"mu",text:"No meetings booked."}));
  list.forEach(function(b){
    var r=el("div",{class:"bk"},[el("div",{},[el("b",{text:b.start+" – "+b.end+"  "}),document.createTextNode(b.title)]),el("div",{class:"mu",text:b.room+" · booked by "+b.by_name+" ("+b.by_email+")"})]);
    if(S.me.admin){var a=el("div",{class:"row",style:"margin-top:6px"}),e=el("button",{text:"Edit"}),x=el("button",{class:"d",text:"Delete"});
      e.onclick=function(){S.edit=b;tab("book")};
      x.onclick=async function(){if(!confirm("Delete this meeting?"))return;try{await api("DELETE","/api/bookings/"+b.id);await load();rCal();say("Meeting deleted.")}catch(er){say(er.message,true)}};
      a.appendChild(e);a.appendChild(x);r.appendChild(a)}
    c2.appendChild(r)});
  if(!S.me.admin)c2.appendChild(el("div",{class:"mu",style:"margin-top:8px",text:"Only admins can modify or delete meetings."}));
  v.appendChild(c2);
}
function rBook(){
  var v=$("v");v.textContent="";var e=S.edit||{},id=e.id;
  var card=el("div",{class:"card"});card.appendChild(el("h2",{text:id?"Modify meeting":"Book a meeting room"}));
  var room=el("select");S.rooms.forEach(function(r){var o=el("option",{text:r,value:r});if(r===e.room)o.selected=true;room.appendChild(o)});
  var date=el("input",{type:"date",min:today(),value:e.date||S.sel||today()}),st=el("input",{type:"time",value:e.start||"10:00"}),en=el("input",{type:"time",value:e.end||"11:00"});
  var ti=el("input",{type:"text",placeholder:"e.g. Weekly sync",value:e.title||"",maxlength:"120",style:"min-width:220px"});
  card.appendChild(el("div",{class:"row"},[el("label",{text:"Room"},[room]),el("label",{text:"Date"},[date]),el("label",{text:"Start"},[st]),el("label",{text:"End"},[en]),el("label",{text:"Title"},[ti])]));
  var go=el("button",{class:"p",text:id?"Save changes":"Book room",style:"margin-top:12px"});
  go.onclick=async function(){
    if(date.value<today())return say("Booking a past date is not allowed.",true);
    try{await api(id?"PUT":"POST",id?"/api/bookings/"+id:"/api/bookings",{room:room.value,date:date.value,start:st.value,end:en.value,title:ti.value});
      S.edit=null;S.sel=date.value;S.month=new Date(date.value+"T00:00:00");S.month.setDate(1);await load();tab("cal");say(id?"Meeting updated.":"Room booked.")}catch(er){say(er.message,true)}};
  card.appendChild(go);
  if(id){var c=el("button",{text:"Cancel",style:"margin:12px 0 0 8px"});c.onclick=function(){S.edit=null;tab("cal")};card.appendChild(c)}
  card.appendChild(el("div",{class:"mu",style:"margin-top:8px",text:"Past dates and times cannot be booked. A room cannot be double-booked."}));
  v.appendChild(card);
}
async function rAdm(){
  var v=$("v");v.textContent="";
  var card=el("div",{class:"card"});card.appendChild(el("h2",{text:"Profile"}));
  [["Company","DLF"],["Name",S.me.name],["Email",S.me.email],["Role",S.me.admin?"Admin":"Member (can book rooms)"]].forEach(function(r){card.appendChild(el("div",{text:r[0]+": "+r[1]}))});
  v.appendChild(card);if(!S.me.admin)return;
  var d;try{d=await api("GET","/api/admins")}catch(e){return say(e.message,true)}
  var c2=el("div",{class:"card"});c2.appendChild(el("h2",{text:"Admins"}));
  c2.appendChild(el("div",{class:"mu",text:"Primary admin: "+(d.owner||"not set")+". Ask the person to create their account first, then add their email here."}));
  if(!d.admins.length)c2.appendChild(el("div",{class:"mu",style:"margin-top:6px",text:"No additional admins yet."}));
  d.admins.forEach(function(a){var r=el("div",{class:"bk row",style:"justify-content:space-between;align-items:center"},[el("span",{text:a})]),x=el("button",{class:"d",text:"Remove"});
    x.onclick=async function(){try{await api("DELETE","/api/admins/"+encodeURIComponent(a));say("Admin removed.");rAdm()}catch(er){say(er.message,true)}};r.appendChild(x);c2.appendChild(r)});
  var inp=el("input",{type:"email",placeholder:"name@company.com",style:"min-width:230px"}),add=el("button",{class:"p",text:"Add admin"});
  add.onclick=async function(){try{await api("POST","/api/admins",{email:inp.value});say("Admin added.");rAdm()}catch(er){say(er.message,true)}};
  c2.appendChild(el("div",{class:"row",style:"margin-top:10px"},[inp,add]));v.appendChild(c2);
}
$("tCal").onclick=function(){S.edit=null;tab("cal")};$("tBook").onclick=function(){S.edit=null;tab("book")};$("tAdm").onclick=function(){tab("adm")};
$("out").onclick=async function(){await api("POST","/api/logout");S.me=null;boot()};
boot().catch(function(e){say(e.message,true)});
})();
</script>
</body>
</html>
