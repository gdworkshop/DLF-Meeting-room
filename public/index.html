<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DLF Meeting Room Scheduler</title>
<style>
:root{--bg:#f6f5f1;--card:#fff;--tx:#1c1c1a;--mu:#6b6a64;--bd:#dcdad2;--ac:#1d4e89;--act:#fff;--bad:#b3261e;--ok:#1a7f4b;--tod:#e8f0fa;color-scheme:light dark}
@media (prefers-color-scheme:dark){:root{--bg:#171716;--card:#222220;--tx:#eeede8;--mu:#a09f97;--bd:#3a3935;--ac:#7fb0ea;--act:#10233b;--bad:#f2928b;--ok:#5ccf95;--tod:#1f2c3d}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:980px;margin:0 auto;padding:16px}
header{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px}
h1{font-size:20px;margin:0}h2{font-size:16px;margin:0 0 8px}.mu{color:var(--mu);font-size:13px}
nav{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
button,input,select{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:6px;padding:7px 10px}
button{cursor:pointer}button.p{background:var(--ac);color:var(--act);border-color:var(--ac)}button.on{border-color:var(--ac);color:var(--ac);font-weight:600}button.d{color:var(--bad);border-color:var(--bad)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:14px;margin-bottom:12px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:end}
label{display:flex;flex-direction:column;font-size:12px;color:var(--mu);gap:3px}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}.dh{font-size:12px;color:var(--mu);text-align:center}
.day{min-height:64px;border:1px solid var(--bd);border-radius:6px;padding:4px;text-align:left;background:var(--card);overflow:hidden;font-size:12px}
.day.t{background:var(--tod)}.day.s{border-color:var(--ac);outline:1px solid var(--ac)}.day.x{opacity:.45}.day.e{visibility:hidden}
.cnt{color:var(--ac);display:block;margin-top:2px}.bk{border-top:1px solid var(--bd);padding:8px 0}.bk:first-child{border-top:0}
.msg{padding:8px 10px;border-radius:6px;margin-bottom:10px;border:1px solid var(--bd)}.msg.err{color:var(--bad);border-color:var(--bad)}
.tl{overflow-x:auto}.tlin{min-width:660px}
.tlh{position:relative;height:18px;margin-left:110px;font-size:11px;color:var(--mu)}.tlh span{position:absolute;transform:translateX(-50%)}
.tlr{display:flex;align-items:center;margin-bottom:6px}.tn{width:110px;flex:none;font-size:13px;padding-right:6px}
.trk{position:relative;flex:1;height:34px;border:1px solid var(--bd);border-radius:6px;overflow:hidden;background:repeating-linear-gradient(90deg,transparent 0,transparent calc(100%/14 - 1px),var(--bd) calc(100%/14 - 1px),var(--bd) calc(100%/14))}
.bar{position:absolute;top:3px;bottom:3px;background:var(--ac);color:var(--act);border-radius:4px;font-size:11px;padding:2px 4px;overflow:hidden;white-space:nowrap}
.nowl{position:absolute;top:0;bottom:0;width:2px;background:var(--bad)}
.st-free{color:var(--ok);font-weight:600}.st-busy{color:var(--bad);font-weight:600}
@media(max-width:600px){.day{min-height:52px;font-size:11px}}
</style>
</head>
<body>
<main>
<header><div><h1>DLF Meeting Room Scheduler</h1><div class="mu" id="who"></div></div><button id="out" hidden>Sign out</button></header>
<nav id="nav" hidden><button id="tCal">Calendar</button><button id="tTime">Time view</button><button id="tBook">Book a room</button><button id="tAdm">Profile</button></nav>
<div id="msg"></div>
<section id="v"></section>
</main>
<script>
(function(){
var MN=["January","February","March","April","May","June","July","August","September","October","November","December"];
var S={me:null,rooms:[],bk:[],month:new Date(),sel:null,edit:null,tab:"cal",now:null,room:"all",fs:"09:00",fe:"10:00"};
S.month.setDate(1);
var A=420,Z=1260,W=Z-A;
var $=function(i){return document.getElementById(i)};
function el(t,a,k){var e=document.createElement(t);if(a)for(var x in a){if(x==="text")e.textContent=a[x];else if(x==="class")e.className=a[x];else e.setAttribute(x,a[x])}(k||[]).forEach(function(c){e.appendChild(c)});return e}
function pad(n){return n<10?"0"+n:""+n}
function mkey(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)}
function today(){return S.now.d}
function fmt(s){var p=s.split("-");return p[2]+" "+MN[+p[1]-1].slice(0,3)+" "+p[0]}
function mins(t){return parseInt(t.slice(0,2),10)*60+parseInt(t.slice(3),10)}
function f12(t){var h=parseInt(t.slice(0,2),10),m=t.slice(3);return ((h+11)%12+1)+":"+m+" "+(h>=12?"PM":"AM")}
function addDays(k,n){var d=new Date(k+"T00:00:00");d.setDate(d.getDate()+n);return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function say(t,err){var m=$("msg");m.textContent="";if(t){m.appendChild(el("div",{class:"msg"+(err?" err":""),text:t}));setTimeout(function(){m.textContent=""},5000)}}
async function api(m,u,b){var r=await fetch(u,{method:m,headers:{"Content-Type":"application/json"},body:b?JSON.stringify(b):undefined});var j=await r.json().catch(function(){return{}});if(!r.ok){var e=new Error(j.error||"Something went wrong");e.status=r.status;throw e}return j}
async function boot(){
  var j=await api("GET","/api/me");S.me=j.user;S.rooms=j.rooms;S.now=j.now;if(!S.sel)S.sel=j.now.d;
  $("who").textContent=S.me?S.me.name+" · "+S.me.email+" · "+(S.me.admin?"Admin":"Member"):"DLF";
  $("out").hidden=$("nav").hidden=!S.me;
  if(!S.me)return rAuth();
  await load();render();
}
async function load(){try{S.bk=await api("GET","/api/bookings?month="+mkey(S.month))}catch(e){if(e.status===401)return boot();say(e.message,true)}}
async function setDay(k){S.sel=k;if(k.slice(0,7)!==mkey(S.month)){S.month=new Date(k+"T00:00:00");S.month.setDate(1);await load()}}
function byDay(d,room){return S.bk.filter(function(b){return b.date===d&&(!room||room==="all"||b.room===room)}).sort(function(a,b){return a.start<b.start?-1:1})}
