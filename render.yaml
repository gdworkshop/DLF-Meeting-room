databases:
  - name: dlf-scheduler-db
    plan: free
services:
  - type: web
    name: dlf-room-scheduler
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: dlf-scheduler-db
          property: connectionString
      - key: SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: APP_TZ
        value: Asia/Kolkata
